[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canada-recruiter-outreach"
version = "0.1.0"
description = "Excel-first Canadian IT recruiter discovery and controlled outreach assistant"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1,<4",
  "requests>=2.31,<3",
  "python-dotenv>=1.0,<2",
  "streamlit>=1.38,<2",
]

[project.scripts]
recruiter-outreach = "recruiter_outreach.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"



